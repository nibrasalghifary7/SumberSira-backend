name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Hanya untuk prisma generate saat npm ci; tidak ada koneksi database di CI.
      DATABASE_URL: postgresql://user:password@localhost:5432/db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  # Deploy otomatis ke Render setelah CI lulus.
  # Isi secret RENDER_DEPLOY_HOOK_URL (Render > service > Settings > Deploy Hook).
  # Kalau memakai auto-deploy bawaan Render, job ini boleh dibiarkan (akan dilewati).
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK"
            echo "Deploy backend diminta."
          else
            echo "Lewati: secret RENDER_DEPLOY_HOOK_URL belum diisi (auto-deploy Render tetap berjalan)."
          fi
