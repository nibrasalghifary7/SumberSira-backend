name: CI

# Integrasi berkelanjutan: setiap Pull Request dan setiap push ke main
# diperiksa otomatis (typecheck, test, build).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: "22"
  # Nilai dummy untuk generate/typecheck/test. Tidak ada koneksi database
  # sungguhan di pipeline; tes memakai database palsu (mock/alur 4xx).
  DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci"
  NODE_ENV: test
  LOG_LEVEL: silent
  PAYMENT_MODE: simulation
  STORAGE_DRIVER: local

jobs:
  verify:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pasang dependency
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint (TypeScript strict)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Build & push image
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bangun dan dorong image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy dijalankan setelah image tersedia. Karena server tujuan berbeda-beda,
  # langkah ini sengaja berupa contoh: isi `DEPLOY_HOST`/kunci SSH di Secrets,
  # lalu hapus komentar. Migrasi database dijalankan SEBELUM container baru
  # menerima trafik (lihat docs/deployment.md).
